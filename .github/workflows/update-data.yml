# Rebuilds the static restroom and water data in public/data/tiles/ from
# OpenStreetMap and commits it. Cloudflare redeploys the site on that commit.
name: Update map data

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch:
  push:
    paths:
      - scripts/build-data.mjs
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: update-map-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download places and build tiles
        run: node scripts/build-data.mjs
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tiles
          if git diff --cached --quiet; then
            echo "No changes to the data."
            exit 0
          fi
          git commit -m "Update restroom and water data from OpenStreetMap"
          git pull --rebase
          git push
